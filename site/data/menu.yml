# The drinks menu: seasons and drinks. Edited in ROBIN's Studio (Menu); by hand it goes like this.
#
# A drink is written once under `drinks:` and a season names its drinks by slug, so a drink
# that comes back in a later season keeps one recipe and one page (/menu/<slug>/).
# The home page shows the season running today (Zurich date); between seasons, the one that
# ended last. Dates are first and last day, both included.
#
# A drink: slug, name (the bar's own, not translated), price_chf, text (the short line on
# the card), experience (what drinking it is like), ingredients (amount, unit, item; unit is
# one of cl, ml, g, dash, drop, barspoon, piece, or left out), method (short steps), pictures
# (the first is the drawing; add more with `bun scripts/add-photo.ts <file> --plain --slug
# menu-<name>`, each with alt text). Texts need English; de, fr and it are optional.
# `draft:` names texts Claude drafted for Elias to check; the Studio drops the mark on save.
seasons:
  - slug: autumn-winter-2026
    name: { en: "Autumn/Winter 2026", de: "Herbst/Winter 2026", fr: "Automne/Hiver 2026", it: "Autunno/Inverno 2026" }
    start: "2026-09-01"
    end: "2027-02-28"
    description: { en: "Our cocktails for the cold half of the year: rye whiskey and bitter orange, caramel and coffee, and some tropical fruit for grey evenings.", de: "Unsere Cocktails für die kalte Hälfte des Jahres: Roggenwhisky und Bitterorange, Karamell und Kaffee und einige tropische Früchte für graue Abende.", fr: "Nos cocktails pour la moitié froide de l'année : whisky de seigle et orange amère, caramel et café, et quelques fruits tropicaux pour les soirées grises.", it: "I nostri cocktail per la metà fredda dell'anno: whisky di segale e arancia amara, caramello e caffè e un po' di frutta tropicale per le serate grigie." }
    draft: [description]
    drinks: [pineapple-express, lazy-monkey, toffee-crush, hanging-garden, black-boulevard]
drinks:
  - slug: pineapple-express
    name: "Pineapple Express"
    price_chf: 18
    text: { en: "Rum, Caribbean pineapple, agave and lime", de: "Rum, karibische Ananas, Agave und Limette", fr: "Rhum, ananas des Caraïbes, agave et citron vert", it: "Rum, ananas caraibico, agave e lime" }
    experience: { en: "Ripe pineapple first, then lime to wake things up, with rum and agave rounding it off. A small holiday in a glass, even on a grey Tuesday.", de: "Zuerst reife Ananas, dann Limette, um die Dinge aufzuwecken, mit Rum und Agave, die es abrunden. Ein kleiner Urlaub im Glas, auch an einem grauen Dienstag.", fr: "Ananas mûr d'abord, puis citron vert pour réveiller les choses, avec du rhum et de l'agave pour le compléter. Une petite fête dans un verre, même un mardi gris.", it: "Prima l'ananas maturo, poi il lime per svegliare le cose, con rum e agave che lo completano. Una piccola vacanza in un bicchiere, anche in un martedì grigio." }
    draft: [experience]
    ingredients: []
    method: []
    pictures:
      - photo: "photos/menu-pineapple-express.jpg"
        alt: { en: "Drawing of an amber drink in a martini glass with a slice of dried citrus.", de: "Zeichnung eines bernsteinfarbenen Drinks im Martiniglas mit einer getrockneten Zitrusscheibe.", fr: "Dessin d'une boisson ambrée dans un verre à martini avec une tranche d'agrumes séchés.", it: "Disegno di una bevanda ambrata in un bicchiere da martini con una fetta di agrumi secchi." }
  - slug: lazy-monkey
    name: "Lazy Monkey"
    price_chf: 18
    text: { en: "Pisco, lychee, orange and passion fruit with cinnamon foam", de: "Pisco, Litschi, Orange und Passionsfrucht mit Zimtschaum", fr: "Pisco, litchi, orange et fruit de la passion avec mousse de cannelle", it: "Pisco, litchi, arancia e frutto della passione con schiuma alla cannella" }
    experience: { en: "Soft cinnamon foam on top, then lychee, passion fruit and pisco. Fruity and gentle, a drink to sip slowly. The name fits.", de: "Weicher Zimtschaum oben, dann Litschi, Passionsfrucht und Pisco. Fruchtig und sanft, ein Getränk, das man langsam geniessen kann. Der Name passt.", fr: "Mousse douce à la cannelle sur le dessus, puis litchi, fruit de la passion et pisco. Fruité et doux, une boisson à siroter lentement. Le nom convient.", it: "Morbida schiuma di cannella in cima, poi litchi, frutto della passione e pisco. Fruttato e delicato, una bevanda da sorseggiare lentamente. Il nome si adatta." }
    draft: [experience]
    ingredients: []
    method: []
    pictures:
      - photo: "photos/menu-lazy-monkey.jpg"
        alt: { en: "Drawing of a foamy yellow drink in a stemmed glass, topped with rose petals.", de: "Zeichnung eines schaumigen gelben Drinks im Stielglas, mit Rosenblättern bestreut.", fr: "Dessin d'une boisson jaune mousseuse dans un verre à tige, surmonté de pétales de rose.", it: "Disegno di una bevanda gialla schiumosa in un bicchiere a stelo, sormontato da petali di rosa." }
  - slug: toffee-crush
    name: "Toffee Crush"
    price_chf: 18
    text: { en: "Vodka, coffee liqueur, caramel, vanilla, orange and lemon", de: "Wodka, Kaffeelikör, Karamell, Vanille, Orange und Zitrone", fr: "Vodka, liqueur de café, caramel, vanille, orange et citron", it: "Vodka, liquore al caffè, caramello, vaniglia, arancia e limone" }
    experience: { en: "Caramel and vanilla like a dessert, coffee liqueur to keep things awake, and orange and lemon so it never gets heavy. Half cocktail, half dessert.", de: "Karamell und Vanille wie ein Dessert, Kaffeelikör, um die Dinge wach zu halten, und Orange und Zitrone, damit es nie schwer wird. Halb Cocktail, halb Dessert.", fr: "Caramel et vanille comme un dessert, liqueur de café pour garder les choses éveillées, et orange et citron pour qu'il ne devienne jamais lourd. Moitié cocktail, moitié dessert.", it: "Caramello e vaniglia come un dessert, liquore al caffè per tenere sveglie le cose e arancia e limone in modo che non diventi mai pesante. Metà cocktail, metà dessert." }
    draft: [experience]
    ingredients: []
    method: []
    pictures:
      - photo: "photos/menu-toffee-crush.jpg"
        alt: { en: "Drawing of a creamy drink in a cut tumbler with a slice of dried orange on the foam.", de: "Zeichnung eines cremigen Drinks im geschliffenen Tumbler mit einer getrockneten Orangenscheibe auf dem Schaum.", fr: "Dessin d'une boisson crémeuse dans un gobelet coupé avec une tranche d'orange séchée sur la mousse.", it: "Disegno di una bevanda cremosa in un bicchiere tagliato con una fetta di arancia secca sulla schiuma." }
  - slug: hanging-garden
    name: "Hanging Garden"
    price_chf: 18
    text: { en: "Mastiha, gin, Aperol, rose and lemon", de: "Mastiha, Gin, Aperol, Rose und Zitrone", fr: "Mastiha, gin, Aperol, rose et citron", it: "Mastiha, gin, Aperol, rosa e limone" }
    experience: { en: "Bitter orange from the Aperol, a scent of rose, and mastiha, a Greek liqueur with a light pine note. Floral but dry, and gone faster than planned.", de: "Bitterorange aus dem Aperol, ein Duft von Rose, und Mastiha, ein griechischer Likör mit einer leichten Kiefernnote. Blumig, aber trocken, und schneller weg als geplant.", fr: "Orange amère de l'Aperol, un parfum de rose, et de mastiha, une liqueur grecque avec une légère note de pin. Floral mais sec, et parti plus vite que prévu.", it: "Arancia amara dell'Aperol, un profumo di rosa, e mastiha, un liquore greco con una leggera nota di pino. Floreale ma asciutto, ed è andato più velocemente del previsto." }
    draft: [experience]
    ingredients: []
    method: []
    pictures:
      - photo: "photos/menu-hanging-garden.jpg"
        alt: { en: "Drawing of an orange drink with a thick foam top in a tumbler, with a rosebud on the rim.", de: "Zeichnung eines orangen Drinks mit dicker Schaumkrone im Tumbler, mit einer Rosenknospe am Rand.", fr: "Dessin d'une boisson orange avec un dessus en mousse épaisse dans un gobelet, avec un bourgeon de rose sur le bord.", it: "Disegno di una bevanda all'arancia con una spessa cima in schiuma in un bicchiere, con un bocciolo di rosa sul bordo." }
  - slug: black-boulevard
    name: "Black Boulevard"
    price_chf: 18
    text: { en: "Rye whiskey, Campari, Montenegro and honey syrup", de: "Rye Whiskey, Campari, Montenegro und Honigsirup", fr: "Whisky de seigle, Campari, Monténégro et sirop de miel", it: "Whisky di segale, Campari, Montenegro e sciroppo di miele" }
    experience: { en: "Dark, bitter and warm: rye whiskey and Campari up front, Montenegro and a little honey to soften it. A slow drink over one big ice cube, for the end of a long day.", de: "Dunkel, bitter und warm: Roggenwhisky und Campari vorne, Montenegro und ein wenig Honig, um es weicher zu machen. Ein langsamer Drink über einem grossen Eiswürfel, für das Ende eines langen Tages.", fr: "Sombre, amer et chaud : whisky de seigle et Campari à l'avant, Montenegro et un peu de miel pour l'adoucir. Un verre lent sur un grand glaçon, pour la fin d'une longue journée.", it: "Scuro, amaro e caldo: whisky di segale e Campari davanti, Montenegro e un po' di miele per ammorbidirlo. Un drink lento su un grande cubetto di ghiaccio, per la fine di una lunga giornata." }
    draft: [experience]
    ingredients: []
    method: []
    pictures:
      - photo: "photos/menu-black-boulevard.jpg"
        alt: { en: "Drawing of a dark red drink over a large ice cube in a cut tumbler, with orange peel.", de: "Zeichnung eines dunkelroten Drinks auf einem grossen Eiswürfel im geschliffenen Tumbler, mit Orangenzeste.", fr: "Dessin d'une boisson rouge foncé sur un grand glaçon dans un gobelet coupé, avec une peau d'orange.", it: "Disegno di una bevanda rosso scuro su un grande cubetto di ghiaccio in un bicchiere tagliato, con buccia d'arancia." }
