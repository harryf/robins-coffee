# The drinks menu: seasons and drinks. Edited in ROBIN's Studio (Menu); by hand it goes like this.
#
# A drink is written once under `drinks:` and a season names its drinks by slug, so a drink
# that comes back in a later season keeps one recipe and one page (/menu/<slug>/).
# The home page shows the season running today (Zurich date); between seasons, the one that
# ended last. Dates are first and last day, both included.
#
# A drink: slug, name (the bar's own, not translated), price_chf, text (the short line on
# the card), experience (what drinking it is like), ingredients (amount, unit, item; unit is
# one of cl, ml, g, dash, drop, barspoon, piece, or left out), method (short steps), pictures
# (the first is the drawing; add more with `bun scripts/add-photo.ts <file> --plain --slug
# menu-<name>`, each with alt text). Texts need English; de, fr and it are optional.
# `draft:` names texts Claude drafted for Elias to check; the Studio drops the mark on save.
seasons:
  - slug: embers-and-velvet
    name: { en: "Embers and Velvet", de: "Glut und Samt", fr: "Braise et velours", it: "Brace e velluto" }
    start: "2026-09-01"
    end: "2027-02-28"
    description: { en: "When the evenings draw in, the bar glows a little warmer, and these cocktails are made for it: rye and bitter orange like a fire burned down to embers, caramel, coffee and cinnamon soft as velvet, and a little tropical fruit to remind you that summer comes back.", de: "Wenn die Abende früher dunkel werden, leuchtet die Bar ein bisschen wärmer, und dafür sind diese Cocktails gemacht: Roggenwhisky und Bitterorange wie ein Feuer, das zu Glut heruntergebrannt ist, Karamell, Kaffee und Zimt weich wie Samt, und ein wenig tropische Frucht als Erinnerung, dass der Sommer wiederkommt.", fr: "Quand les soirées raccourcissent, le bar brille un peu plus chaud, et ces cocktails sont faits pour ça: whisky de seigle et orange amère comme un feu réduit en braises, caramel, café et cannelle doux comme du velours, et un peu de fruits tropicaux pour te rappeler que l'été revient.", it: "Quando le sere si accorciano, il bar si accende di una luce più calda, e questi cocktail sono fatti per questo: whisky di segale e arancia amara come un fuoco ridotto a brace, caramello, caffè e cannella morbidi come il velluto, e un po' di frutta tropicale per ricordarti che l'estate torna." }
    draft: [description]
    drinks: [pineapple-express, lazy-monkey, toffee-crush, hanging-garden, black-boulevard]
drinks:
  - slug: pineapple-express
    name: "Pineapple Express"
    price_chf: 18
    text: { en: "Rum, Caribbean pineapple, agave and lime", de: "Rum, karibische Ananas, Agave und Limette", fr: "Rhum, ananas des Caraïbes, agave et citron vert", it: "Rum, ananas caraibico, agave e lime" }
    experience: { en: "Close your eyes and the grey outside is gone: ripe pineapple washes in like a warm wave, lime snaps you awake, and rum and agave carry you somewhere with palm trees. A holiday that fits in one glass, even on a Tuesday in November.", de: "Schliess die Augen, und das Grau draussen ist weg: Reife Ananas rollt heran wie eine warme Welle, Limette weckt dich auf, und Rum und Agave tragen dich irgendwohin mit Palmen. Ferien, die in ein Glas passen, auch an einem Dienstag im November.", fr: "Ferme les yeux et le gris du dehors disparaît: l'ananas mûr arrive comme une vague tiède, le citron vert te réveille, et le rhum et l'agave t'emmènent quelque part sous les palmiers. Des vacances qui tiennent dans un verre, même un mardi de novembre.", it: "Chiudi gli occhi e il grigio là fuori sparisce: l'ananas maturo arriva come un'onda tiepida, il lime ti sveglia, e rum e agave ti portano da qualche parte tra le palme. Una vacanza che sta in un bicchiere, anche un martedì di novembre." }
    draft: [experience]
    ingredients: []
    method: []
    pictures:
      - photo: "photos/menu-pineapple-express.jpg"
        alt: { en: "Drawing of an amber drink in a martini glass with a slice of dried citrus.", de: "Zeichnung eines bernsteinfarbenen Drinks im Martiniglas mit einer getrockneten Zitrusscheibe.", fr: "Dessin d'une boisson ambrée dans un verre à martini avec une tranche d'agrumes séchés.", it: "Disegno di una bevanda ambrata in un bicchiere da martini con una fetta di agrumi secchi." }
  - slug: lazy-monkey
    name: "Lazy Monkey"
    price_chf: 18
    text: { en: "Pisco, lychee, orange and passion fruit with cinnamon foam", de: "Pisco, Litschi, Orange und Passionsfrucht mit Zimtschaum", fr: "Pisco, litchi, orange et fruit de la passion avec mousse de cannelle", it: "Pisco, litchi, arancia e frutto della passione con schiuma alla cannella" }
    experience: { en: "Your lips meet a pillow of cinnamon foam first, warm as a winter market. Underneath, lychee and passion fruit, sweet and a little wild, with pisco humming along. You'll want to lean back and take your time. That's the whole idea.", de: "Zuerst triffst du auf ein Kissen aus Zimtschaum, warm wie ein Weihnachtsmarkt. Darunter Litschi und Passionsfrucht, süss und ein bisschen wild, und der Pisco summt mit. Du willst dich zurücklehnen und dir Zeit lassen. Genau darum geht es.", fr: "Tes lèvres rencontrent d'abord un coussin de mousse à la cannelle, chaud comme un marché de Noël. Dessous, litchi et fruit de la passion, doux et un peu sauvages, avec le pisco qui fredonne. Tu auras envie de te caler dans ton fauteuil et de prendre ton temps. C'est tout le principe.", it: "Le labbra incontrano prima un cuscino di schiuma alla cannella, caldo come un mercatino di Natale. Sotto, litchi e frutto della passione, dolci e un po' selvaggi, con il pisco che canticchia. Ti verrà voglia di appoggiarti allo schienale e prendertela comoda. È proprio questa l'idea." }
    draft: [experience]
    ingredients: []
    method: []
    pictures:
      - photo: "photos/menu-lazy-monkey.jpg"
        alt: { en: "Drawing of a foamy yellow drink in a stemmed glass, topped with rose petals.", de: "Zeichnung eines schaumigen gelben Drinks im Stielglas, mit Rosenblättern bestreut.", fr: "Dessin d'une boisson jaune mousseuse dans un verre à tige, surmonté de pétales de rose.", it: "Disegno di una bevanda gialla schiumosa in un bicchiere a stelo, sormontato da petali di rosa." }
  - slug: toffee-crush
    name: "Toffee Crush"
    price_chf: 18
    text: { en: "Vodka, coffee liqueur, caramel, vanilla, orange and lemon", de: "Wodka, Kaffeelikör, Karamell, Vanille, Orange und Zitrone", fr: "Vodka, liqueur de café, caramel, vanille, orange et citron", it: "Vodka, liquore al caffè, caramello, vaniglia, arancia e limone" }
    experience: { en: "It starts like the best dessert you had as a kid: caramel and vanilla, slow and golden. Then the coffee liqueur taps you on the shoulder, and orange and lemon open the window so it never gets heavy. Dessert and nightcap in one, and you don't have to choose.", de: "Es fängt an wie das beste Dessert deiner Kindheit: Karamell und Vanille, langsam und golden. Dann tippt dir der Kaffeelikör auf die Schulter, und Orange und Zitrone öffnen das Fenster, damit es nie schwer wird. Dessert und Schlummertrunk in einem, und du musst dich nicht entscheiden.", fr: "Ça commence comme le meilleur dessert de ton enfance: caramel et vanille, lents et dorés. Puis la liqueur de café te tape sur l'épaule, et l'orange et le citron ouvrent la fenêtre pour que rien ne pèse. Dessert et dernier verre à la fois, pas besoin de choisir.", it: "Comincia come il dolce più buono della tua infanzia: caramello e vaniglia, lenti e dorati. Poi il liquore al caffè ti batte sulla spalla, e arancia e limone aprono la finestra perché non diventi mai pesante. Dessert e bicchiere della staffa insieme, senza dover scegliere." }
    draft: [experience]
    ingredients: []
    method: []
    pictures:
      - photo: "photos/menu-toffee-crush.jpg"
        alt: { en: "Drawing of a creamy drink in a cut tumbler with a slice of dried orange on the foam.", de: "Zeichnung eines cremigen Drinks im geschliffenen Tumbler mit einer getrockneten Orangenscheibe auf dem Schaum.", fr: "Dessin d'une boisson crémeuse dans un gobelet coupé avec une tranche d'orange séchée sur la mousse.", it: "Disegno di una bevanda cremosa in un bicchiere tagliato con una fetta di arancia secca sulla schiuma." }
  - slug: hanging-garden
    name: "Hanging Garden"
    price_chf: 18
    text: { en: "Mastiha, gin, Aperol, rose and lemon", de: "Mastiha, Gin, Aperol, Rose und Zitrone", fr: "Mastiha, gin, Aperol, rose et citron", it: "Mastiha, gin, Aperol, rosa e limone" }
    experience: { en: "Your senses wake one by one: first the bitter orange of the Aperol, then the scent of rose, like walking past a garden wall on a summer evening. Mastiha, a Greek liqueur, leaves a light trace of pine. Floral but dry, and somehow the glass is empty sooner than you planned.", de: "Deine Sinne erwachen einer nach dem anderen: zuerst die Bitterorange vom Aperol, dann der Duft von Rosen, wie an einem Sommerabend an einer Gartenmauer vorbei. Mastiha, ein griechischer Likör, hinterlässt eine leichte Spur von Kiefer. Blumig, aber trocken, und irgendwie ist das Glas früher leer als geplant.", fr: "Tes sens s'éveillent un à un: d'abord l'orange amère de l'Aperol, puis le parfum de la rose, comme en longeant le mur d'un jardin un soir d'été. Le mastiha, une liqueur grecque, laisse une légère trace de pin. Floral mais sec, et curieusement le verre est vide plus tôt que prévu.", it: "I sensi si svegliano uno alla volta: prima l'arancia amara dell'Aperol, poi il profumo di rosa, come passare accanto al muro di un giardino in una sera d'estate. La mastiha, un liquore greco, lascia una leggera traccia di pino. Floreale ma secco, e chissà come il bicchiere è vuoto prima del previsto." }
    draft: [experience]
    ingredients: []
    method: []
    pictures:
      - photo: "photos/menu-hanging-garden.jpg"
        alt: { en: "Drawing of an orange drink with a thick foam top in a tumbler, with a rosebud on the rim.", de: "Zeichnung eines orangen Drinks mit dicker Schaumkrone im Tumbler, mit einer Rosenknospe am Rand.", fr: "Dessin d'une boisson orange avec un dessus en mousse épaisse dans un gobelet, avec un bourgeon de rose sur le bord.", it: "Disegno di una bevanda all'arancia con una spessa cima in schiuma in un bicchiere, con un bocciolo di rosa sul bordo." }
  - slug: black-boulevard
    name: "Black Boulevard"
    price_chf: 18
    text: { en: "Rye whiskey, Campari, Montenegro and honey syrup", de: "Rye Whiskey, Campari, Montenegro und Honigsirup", fr: "Whisky de seigle, Campari, Monténégro et sirop de miel", it: "Whisky di segale, Campari, Montenegro e sciroppo di miele" }
    experience: { en: "Picture a city street after rain, lamps shining in the puddles. Rye whiskey and Campari arrive first, bitter and bold; Montenegro and a touch of honey soften the edges. One big ice cube, no hurry. The drink for the end of a long day, when the evening is finally yours.", de: "Stell dir eine Strasse nach dem Regen vor, Laternen glänzen in den Pfützen. Roggenwhisky und Campari kommen zuerst, bitter und kräftig; Montenegro und ein Hauch Honig runden die Kanten ab. Ein grosser Eiswürfel, keine Eile. Der Drink fürs Ende eines langen Tages, wenn der Abend endlich dir gehört.", fr: "Imagine une rue après la pluie, les réverbères qui brillent dans les flaques. Le whisky de seigle et le Campari arrivent d'abord, amers et francs; le Montenegro et une touche de miel arrondissent les angles. Un gros glaçon, rien ne presse. Le verre de la fin d'une longue journée, quand la soirée est enfin à toi.", it: "Immagina una strada dopo la pioggia, i lampioni che brillano nelle pozzanghere. Whisky di segale e Campari arrivano per primi, amari e decisi; il Montenegro e un tocco di miele smussano gli spigoli. Un grande cubetto di ghiaccio, nessuna fretta. Il drink per la fine di una lunga giornata, quando la serata è finalmente tua." }
    draft: [experience]
    ingredients: []
    method: []
    pictures:
      - photo: "photos/menu-black-boulevard.jpg"
        alt: { en: "Drawing of a dark red drink over a large ice cube in a cut tumbler, with orange peel.", de: "Zeichnung eines dunkelroten Drinks auf einem grossen Eiswürfel im geschliffenen Tumbler, mit Orangenzeste.", fr: "Dessin d'une boisson rouge foncé sur un grand glaçon dans un gobelet coupé, avec une peau d'orange.", it: "Disegno di una bevanda rosso scuro su un grande cubetto di ghiaccio in un bicchiere tagliato, con buccia d'arancia." }
